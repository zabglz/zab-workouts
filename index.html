<style>
/* Layout: dark training binder. Filter chips, color-coded workout tabs, one sheet per workout; full-screen player with an orbitable 3D mannequin. Accent changes per workout type. */
:root{
  --bg:#0a0a0a; --sheet:#131313; --sheet2:#1a1a1a; --ink:#f3f3f3; --muted:#a2a2a2; --line:#262626;
  --c-chest:#D24E26; --c-back:#4B6BE2; --c-legs:#ADD893; --c-shoulders:#F1A33A; --c-arms:#F7F56B; --c-circuit:#39FF6A; --c-bw:#FFFFFF;
  --accent:#D24E26; --accent-ink:#ffffff; --bar:#2a2a2a;
  --display:"Anton","Arial Narrow",Impact,sans-serif; --body:"Inter",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-block:calc(env(safe-area-inset-top,0px) + 44px) 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:2.6rem;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance;text-transform:uppercase}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0}
.chips,.tabs{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:.88rem;text-align:left;display:flex;gap:9px;align-items:center}
.tab .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tab small{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--sheet2);box-shadow:inset 0 -2px 0 var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:18px;border-top:3px solid var(--accent)}
.head h2{font-family:var(--display);font-size:2.1rem;margin:0;line-height:1.05;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meta span{font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}
.block{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.bh h3{margin:0;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.bh h3 b{color:var(--ink);font-size:1rem;text-transform:none;letter-spacing:0;margin-left:6px}
.sets{font-family:var(--mono);font-size:.85rem;color:var(--accent);font-weight:500}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
.amt{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:8px}
.bar{display:inline-block;height:8px;border-radius:2px;background:var(--accent);opacity:.45}
.note{font-size:.82rem;color:var(--muted)}
.total{font-family:var(--mono);text-align:right;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.tempo{font-size:.82rem;color:var(--muted)}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.start{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;font-weight:600;font-size:1rem}
li.go{cursor:pointer}
li.go:hover span:first-child{color:var(--accent)}
.view{display:flex;flex-direction:column;gap:18px}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar,.car::-webkit-scrollbar{display:none}
.chip{flex:none}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:4px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));scroll-padding-left:max(16px,env(safe-area-inset-left,0px))}
.card{--c:var(--accent);flex:none;width:min(88vw,396px);aspect-ratio:4/5;border-radius:22px;position:relative;overflow:hidden;scroll-snap-align:start;border:1px solid var(--line);background:radial-gradient(110% 75% at 50% 30%,color-mix(in srgb,var(--c) 24%,#121212) 0%,#0d0d0d 72%);cursor:pointer;text-align:left;padding:0;color:var(--ink)}
.card:hover,.card:focus-visible{border-color:var(--c)}
.card canvas,.hero canvas{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;display:block}
.ov{position:absolute;left:0;right:0;bottom:0;padding:18px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.82) 45%);display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tag{border:1px solid var(--c);color:var(--c);font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;padding:3px 8px;border-radius:6px;text-transform:uppercase;background:rgba(0,0,0,.4)}
.card h3,.hero h2{font-family:var(--display);font-size:2.3rem;text-transform:uppercase;margin:6px 0 0;line-height:.92;letter-spacing:.005em;text-wrap:balance}
.eq{color:#d0d0d0;font-size:.86rem}
.dur{position:absolute;top:14px;right:14px;font-family:var(--mono);font-size:.76rem;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.12);padding:4px 9px;border-radius:999px;color:var(--ink)}
.libhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:6px}
.libhead h2{margin:0;font-size:.85rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.libhead span{font-family:var(--mono);font-size:.85rem;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gcard{--c:var(--accent);background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-width:0}
.gcard:hover,.gcard:focus-visible{border-color:var(--c)}
.gcard small{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gcard small i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.gcard b{font-family:var(--display);font-size:1.35rem;text-transform:uppercase;line-height:1;letter-spacing:.01em}
.gcard span{font-size:.78rem;color:var(--muted)}
.dtop{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:5;background:var(--bg);padding-block:6px;margin-top:-10px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font-size:.95rem;padding:8px 4px 8px 0}
.back svg,.start svg,.elapsed svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.start svg{fill:currentColor;stroke:none}
.hero{--c:var(--accent);position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:1;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(110% 75% at 50% 32%,color-mix(in srgb,var(--c) 24%,#121212) 0%,#0d0d0d 72%)}
.hero h2{font-size:2.8rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:1.05rem;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cta{position:sticky;bottom:0;z-index:5;padding-top:14px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(10,10,10,0),var(--bg) 40%);margin-top:-6px}
.cta .start{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;font-size:1.05rem;border-radius:14px}
.elapsed{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.9rem;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums}
.elapsed svg{color:var(--accent)}
.elapsed.paused{color:var(--muted)}
::view-transition-group(hero){animation-duration:.38s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
.player{position:fixed;inset:0;z-index:50;overscroll-behavior:none;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"top" "prog" "fig" "info" "ctrl";gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 40px);padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ptop{grid-area:top;display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0}
.ptop .where{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pright{display:flex;gap:8px;align-items:center;flex:none}
.x{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px}
.prog{grid-area:prog;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.figcol{grid-area:fig;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.figwrap{position:relative;width:min(100%,44vh);width:min(100%,44dvh);max-width:640px;transition:width .35s ease}
.fmin{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(10,10,10,.75);color:var(--ink);display:grid;place-items:center;padding:0}
.fmin svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fmin .i-grow{display:none}.player.mini .fmin .i-grow{display:inline}.player.mini .fmin .i-shrink{display:none}
canvas#fig{display:block;width:100%;aspect-ratio:1;background:var(--sheet);border:1px solid var(--line);border-radius:16px;touch-action:none;cursor:grab}
canvas#fig:active{cursor:grabbing}
.ftag{position:absolute;left:10px;top:10px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:rgba(10,10,10,.7);padding:3px 8px;border-radius:6px;pointer-events:none}
.fhint{position:absolute;right:10px;bottom:10px;font-size:.72rem;color:var(--muted);pointer-events:none}
.views{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.views button{border:1px solid var(--line);background:var(--sheet);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:.78rem}
.views button[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.infocol{grid-area:info;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.psub{display:none;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.pname{font-family:var(--display);font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.05;text-wrap:balance;margin:0;text-transform:uppercase}
.pname.rest{color:var(--muted)}
.clock{font-family:var(--mono);font-size:clamp(3.2rem,15vw,6rem);font-variant-numeric:tabular-nums;line-height:1;color:var(--accent)}
.clock.reps{font-size:clamp(2.2rem,9vw,3.6rem);color:var(--ink)}
.next{font-size:.9rem;color:var(--muted)}
.pup{display:none;list-style:none;margin:10px 0 0;padding:0;width:min(100%,440px);border-top:1px solid var(--line)}
.pup li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.95rem;text-align:left}
.pup li b{font-weight:500;color:var(--ink)}
.pup li span{font-family:var(--mono);font-size:.85rem}
.pup li.r b{color:var(--muted);font-weight:400}
/* minimized illustration: text takes the lead */
.player.mini .figwrap{width:min(46vw,24vh);width:min(46vw,24dvh)}
.player.mini .views,.player.mini .fhint{display:none}
.player.mini .psub,.player.mini .pup{display:block}
.player.mini .next{display:none}
.player.mini .pname{font-size:clamp(2.2rem,8.5vw,4rem)}
.player.mini .clock{font-size:clamp(4.6rem,22vw,9rem)}
.player.mini .clock.reps{font-size:clamp(3rem,13vw,6rem)}
.player.mini{grid-template-rows:auto auto auto minmax(0,1fr) auto}
@media (prefers-reduced-motion:reduce){.figwrap{transition:none}}
/* landscape */
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  .player{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top top" "prog prog" "fig info" "fig ctrl";column-gap:28px}
  .figwrap{width:min(52vw,calc(100vh - 150px));width:min(52vw,calc(100dvh - 150px))}
  .player.mini{grid-template-rows:auto auto minmax(0,1fr) auto}
  .player.mini .figwrap{width:min(26vw,calc(100vh - 150px));width:min(26vw,calc(100dvh - 150px))}
  .player.mini .infocol{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-areas:"sub up" "name up" "clock up";align-items:center;column-gap:28px}
  .player.mini .psub{grid-area:sub}.player.mini .pname{grid-area:name}.player.mini .clock{grid-area:clock}
  .player.mini .pup{grid-area:up;margin:0}
  .player.mini .pname{font-size:clamp(1.8rem,9vh,3.6rem)}
  .player.mini .clock{font-size:clamp(3.6rem,20vh,8rem)}
  .player.mini .clock.reps{font-size:clamp(2.6rem,13vh,5.5rem)}
}
@media (orientation:landscape) and (max-height:520px){
  .player{gap:6px;padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
  .figwrap{width:min(52vw,calc(100vh - 110px));width:min(52vw,calc(100dvh - 110px))}
  .player.mini .figwrap{width:min(26vw,calc(100vh - 110px));width:min(26vw,calc(100dvh - 110px))}
  .views button{padding:3px 9px;font-size:.72rem}
  .pname{font-size:clamp(1.3rem,7vh,2rem)}
  .clock{font-size:clamp(2.6rem,16vh,4.5rem)}
  .clock.reps{font-size:clamp(1.8rem,10vh,3rem)}
  .ctrl button{padding:10px 8px}
  .pup li{padding:5px 2px;font-size:.85rem}
}
.ctrl{grid-area:ctrl;display:flex;justify-content:center;gap:10px;max-width:640px;width:100%;margin:0 auto}
.ctrl button{flex:1;border-radius:12px;padding:16px 8px;font-size:1rem;font-weight:600;border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
.ctrl .main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1.6}

/* ===== Refinement pass: athletic editorial language (dark), per-workout accents kept =====
   Rules: one display tier (condensed uppercase, line-height .9) for titles only; quiet Inter UI;
   flat surfaces, no shadows; every action is a pill or a circle; one solid accent pill per screen;
   8px rhythm; 44px+ touch targets; tap-collapse feedback. */
:root{--cloud:#1b1b1d;--cloud2:#232326;--hair:#2a2a2d;--mute2:#8e8e92;--r-pill:999px}
body{font-feature-settings:"ss01","cv11";letter-spacing:-.005em}
h1{font-size:clamp(2.6rem,12vw,4rem);line-height:.9;letter-spacing:0}
.sub{font-size:.95rem;color:var(--mute2)}
.wrap{gap:24px}
.view{gap:24px}
/* chips: hairline pill, active fully inverted */
.chip{min-height:40px;padding:8px 18px;font-weight:500;font-size:.9rem;background:transparent;border-color:var(--hair)}
.chip[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
/* carousel cards: the art is the card */
.card{border:0;border-radius:24px}
.card h3{font-size:clamp(2.6rem,11vw,3.4rem);line-height:.9;margin-top:8px}
.card .eq{font-size:.88rem;color:#cfcfd2}
.card:focus-visible,.gcard:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.card:hover{border:0}
.tag{border-radius:var(--r-pill);padding:4px 10px;font-family:var(--body);font-weight:600;font-size:.68rem;letter-spacing:.1em}
.dur{font-family:var(--body);font-weight:600;font-size:.75rem;padding:6px 11px;background:rgba(10,10,10,.65);border:0}
/* library: flat tiles on soft surface, no borders */
.libhead h2{font-family:var(--body);font-size:.78rem;letter-spacing:.14em;color:var(--mute2)}
.libhead span{font-family:var(--body);font-weight:600;font-size:.82rem}
.grid{gap:8px}
.gcard{background:var(--cloud);border:0;border-radius:18px;padding:16px;gap:8px;min-height:112px;justify-content:flex-end}
.gcard b{font-size:1.6rem;line-height:.95;letter-spacing:.005em;overflow-wrap:anywhere}
.gcard small{font-family:var(--body);font-weight:600;letter-spacing:.1em;font-size:.66rem}
.gcard span{font-size:.8rem;color:var(--mute2);line-height:1.35}
/* detail */
.dtop{padding-block:8px}
.back{gap:10px;color:var(--ink);font-weight:500;padding:0;min-height:44px}
.back .ic{width:40px;height:40px;border-radius:50%;background:var(--cloud);display:grid;place-items:center}
.hero{border:0;border-radius:24px}
.hero h2{font-size:clamp(3rem,14vw,4.6rem);line-height:.88}
.stats{gap:8px}
.stat{background:var(--cloud);border:0;border-radius:18px;padding:14px 6px}
.stat b{font-family:var(--body);font-weight:600;font-size:1.2rem}
.stat small{color:var(--mute2);font-weight:500}
.sheet{background:transparent;border:0;border-top:0;padding:0;gap:0}
.block{border-top:1px solid var(--hair);padding-block:20px;gap:6px}
.bh h3{font-size:.72rem;letter-spacing:.12em;color:var(--mute2)}
.bh h3 b{display:block;margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:.95;text-transform:uppercase;letter-spacing:.005em}
.sets{font-family:var(--body);font-weight:600;font-size:.82rem;background:var(--cloud);color:var(--accent);padding:5px 11px;border-radius:var(--r-pill);align-self:flex-start}
li{border-bottom:1px solid var(--hair);padding:12px 0;min-height:48px}
li.go:active{background:var(--cloud)}
.amt{font-family:var(--body);font-weight:500;color:var(--ink)}
.bar{height:6px;border-radius:3px;opacity:.6}
.note,.tempo{color:var(--mute2)}
.start{border-radius:var(--r-pill);font-weight:600}
.cta .start{min-height:56px;border-radius:var(--r-pill);font-size:1.05rem;letter-spacing:.01em}
/* player */
.x{width:44px;height:44px;padding:0;border-radius:50%;background:var(--cloud);border:0;display:grid;place-items:center}
.x svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.elapsed{min-height:44px;padding:0 16px;background:var(--cloud);border:0;font-family:var(--body);font-weight:600;font-size:1rem}
.prog{height:3px}
canvas#fig{border:0;border-radius:24px;background:var(--cloud)}
.fmin{width:40px;height:40px;border-radius:50%;border:0;background:rgba(10,10,10,.7)}
.views{gap:6px}
.views button{min-height:36px;padding:6px 14px;font-weight:500;background:transparent;border-color:var(--hair)}
.views button[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.ftag{border-radius:var(--r-pill);padding:4px 10px;font-weight:600}
.psub{letter-spacing:.12em;font-weight:600;font-size:.78rem}
.pname{line-height:.92;letter-spacing:.005em;font-weight:400}
.clock{font-family:var(--body);font-weight:700;letter-spacing:-.03em}
.clock.reps{font-weight:600;letter-spacing:-.02em}
.next{color:var(--mute2)}
.pup{border-top:1px solid var(--hair)}
.pup li{border-bottom:1px solid var(--hair);min-height:0;padding:10px 2px}
.pup li span{font-family:var(--body);font-weight:500}
.ctrl{gap:8px}
.ctrl button{min-height:56px;padding:0 8px;border-radius:var(--r-pill);border:0;background:var(--cloud);font-weight:600}
.ctrl .main{background:var(--accent);color:var(--accent-ink)}
@media (orientation:landscape) and (max-height:520px){.ctrl button{min-height:46px}.x,.elapsed{min-height:38px}.x{width:38px;height:38px}}
/* tap-collapse feedback */
button{transition:transform .12s ease,opacity .12s ease;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96);opacity:.85}
.card:active{transform:scale(.985)}
@media (prefers-reduced-motion:reduce){button{transition:none}button:active,.card:active{transform:none}}

/* bug-fix pass */
.dtop{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);margin-top:calc(-1*(env(safe-area-inset-top,0px) + 10px));padding-bottom:10px;background:var(--bg);box-shadow:inset 0 -1px 0 var(--hair)}
.hero{width:min(100%,560px,62vh);width:min(100%,560px,62dvh)}
.hero,.card{container-type:inline-size}
.hero h2{font-size:clamp(1.8rem,15cqw,4.2rem);overflow-wrap:normal}
.card h3{font-size:clamp(1.8rem,13cqw,3.4rem)}
.hero .ov{padding:16px}
.card h3{overflow-wrap:normal}
.player.mini .infocol{justify-content:flex-start;padding-top:8px}
.sheet{padding-bottom:8px}
@media (orientation:landscape) and (max-height:520px){.cta{position:static;background:none;margin-top:0}.hero{width:min(100%,420px,78vh)}}
@media (min-width:1000px){.player{padding-left:max(32px,calc((100vw - 1200px)/2));padding-right:max(32px,calc((100vw - 1200px)/2))}}

/* muscle chips + landscape spacing */
.fmus{position:absolute;left:10px;bottom:10px;right:110px;display:flex;flex-wrap:wrap;gap:4px;font-size:.72rem;font-weight:600;color:var(--ink);pointer-events:none}
.fmus span{display:inline-flex;align-items:center;gap:5px;background:rgba(10,10,10,.6);padding:3px 8px 3px 6px;border-radius:999px}
.fmus i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
.player.mini .fmus{display:none}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  .figcol{padding-top:10px;justify-content:flex-start}
  .figwrap{width:min(50vw,calc(100vh - 230px));width:min(50vw,calc(100dvh - 230px))}
  .player.mini .figwrap{width:min(26vw,calc(100vh - 230px));width:min(26vw,calc(100dvh - 230px))}}
@media (orientation:landscape) and (max-height:520px){
  .figcol{padding-top:8px;gap:6px}
  .figwrap{width:min(50vw,calc(100vh - 175px));width:min(50vw,calc(100dvh - 175px))}
  .player.mini .figwrap{width:min(26vw,calc(100vh - 175px));width:min(26vw,calc(100dvh - 175px))}
  .views button{min-height:30px;padding:3px 10px}}
</style>

function route(animate,fromCard){

      const back=document.querySelector(`.card[data-id="${cur}"]`);if(back&&animate)back.style.viewTransitionName="hero";window.scrollTo(0,homeY);if(back){const c=document.getElementById("car");c.scrollLeft=Math.max(0,back.offsetLeft-20)}

    const fa=chain(ua.Q,R0['el'+S2],R0['hand'+S2],J['el'+S2],J['hand'+S2],zf);
    put(fa.Q,fa.Fo,J['el'+S2],f(rest.el),BL.fa/(L0['fa'+S2]*S));
    const wr=add(J['el'+S2],mul(nrm(sub(J['hand'+S2],J['el'+S2])),BL.fa));
    put(fa.Q,fa.Fo,wr,f(rest.wr),0);
    const th=chain(Qp,R0['hip'+S2],R0['knee'+S2],J['hip'+S2],J['knee'+S2],xf);
    put(th.Q,th.Fo,J['hip'+S2],f(rest.hip),BL.th/(L0['th'+S2]*S));
    const sn=chain(th.Q,R0['knee'+S2],R0['ank'+S2],J['knee'+S2],J['ank'+S2],xf);
    put(sn.Q,sn.Fo,J['knee'+S2],f(rest.kn),BL.sh/(L0['sh'+S2]*S));
    const ft=chain(sn.Q,R0['heel'+S2],R0['toe'+S2],J['heel'+S2],J['toe'+S2],xf);
    put(ft.Q,ft.Fo,J['ank'+S2],f(rest.an),0);
  }
  for(const [Q,o,mo] of cl)put(Q,[[1,0,0],[0,1,0],[0,0,1]],o,mo,0);
  return bones}
function g3meshDraw(J,hotFn,accentHex,grip){
  const M=g3meshInit();if(!M)return false;const T=G3.T;
  const B=g3meshPose(M,J),L0=M.meta.L0,names=M.meta.bones,S=MESHS,{pos,loc,bidx,bw,nv,locF,fmap}=M,gr=grip||[0,0],xs=M.meta.restX;
  const Lm=names.map(n=>L0[n]);
  for(let i=0;i<nv;i++){let px=0,py=0,pz=0;
    for(let s=0;s<3;s++){const w=bw[i*3+s];if(!w)continue;const b=B[bidx[i*3+s]],li=i*9+s*3;
      let u=loc[li]*.001,v0=loc[li+1]*.001,ww=loc[li+2]*.001;const fi=fmap[i];
      if(fi>=0){const gg=gr[xs[i]?1:0];if(gg>0){const lf=fi*9+s*3;u+=(locF[lf]*.001-u)*gg;v0+=(locF[lf+1]*.001-v0)*gg;ww+=(locF[lf+2]*.001-ww)*gg}}
      let v=v0;
      if(b.k){const L=Lm[bidx[i*3+s]],c=v0<0?0:v0>L?L:v0;v=c*b.k+(v0-c)}
      const x=b.o[0]+(b.x[0]*u+b.y[0]*v+b.z[0]*ww)*S,y=b.o[1]+(b.x[1]*u+b.y[1]*v+b.z[1]*ww)*S,z=b.o[2]+(b.x[2]*u+b.y[2]*v+b.z[2]*ww)*S;
      px+=x*w;py+=y*w;pz+=z*w}
    const sum=bw[i*3]+bw[i*3+1]+bw[i*3+2]||1;pos[i*3]=px/sum;pos[i*3+1]=py/sum;pos[i*3+2]=pz/sum}
  M.g.attributes.position.needsUpdate=true;M.g.computeVertexNormals();
  const key=accentHex+'|'+hotFn.key;
  if(M.lastKey!==key){M.lastKey=key;const ac=new T.Color(accentHex),lum=.2126*ac.r+.7152*ac.g+.0722*ac.b,base=lum>.8?[.5,.52,.56]:[.68,.7,.74];
    const col=M.g.attributes.color.array,hot=M.g.attributes.hot.array,RN=M.meta.regions,hr=RN.map(n=>hotFn(n)?1:0);
    for(let i=0;i<nv;i++){const h=hr[M.reg[i]];hot[i]=h;const c=h?[ac.r,ac.g,ac.b]:base;col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2]}
    M.g.attributes.color.needsUpdate=true;M.g.attributes.hot.needsUpdate=true;M.rim.value.copy(ac).multiplyScalar(.4)}
  M.mesh.visible=true;return true}

/* ---------- player figure ---------- */
const cv=document.getElementById("fig"),cx=cv.getContext("2d");
let FIG=defFor("stand"),figPaused=false,animT=0,lastTs=0,cam={yaw:30,el:12},spin=false,drag=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function setFig(name,tag){FIG=defFor(name);vi=0;{const m=document.getElementById("fmus"),mu=(FIG.d.mu||"").split(" ").filter(Boolean);m.hidden=!mu.length;m.innerHTML=mu.map(x=>`<span><i></i>${MUN[x]}</span>`).join("")}animT=0;cam.yaw=FIG.d.v??30;cam.el=12;const t=document.getElementById("ftag");t.hidden=!tag;t.textContent=tag||"";syncView()}
function fitCanvas(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=w}}
function drawFig(ts){
  if(!player.hidden){const dt=lastTs?Math.min(.1,(ts-lastTs)/1000):0;lastTs=ts;if(!figPaused&&!reduce)animT+=dt;if(spin&&!drag)cam.yaw+=dt*30;
    fitCanvas();drawScene(cx,cv.width,cv.height,FIG.d,frameAt(FIG.d,animT),cam,getComputedStyle(document.documentElement).getPropertyValue("--accent").trim(),FIG.mirror,"#131313")}
  else lastTs=0;requestAnimationFrame(drawFig)}
requestAnimationFrame(drawFig);
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,yaw:cam.yaw,el:cam.el};cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(!drag)return;cam.yaw=drag.yaw-(e.clientX-drag.x)*.55;cam.el=Math.max(-5,Math.min(75,drag.el+(e.clientY-drag.y)*.3));syncView()});
const endDrag=()=>{drag=null};cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);
const VIEWS=[["Best",null],["Front",[0,12]],["¾",[45,12]],["Side",[90,12]],["Back",[180,12]],["Top",[30,70]]];let vi=0;
function syncView(){const b=document.getElementById("vcycle");if(b)b.textContent="View: "+VIEWS[vi][0];document.querySelector('#views [data-v="spin"]').setAttribute("aria-pressed",spin)}
document.getElementById("views").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.v==="spin"){spin=!spin}else{vi=(vi+1)%VIEWS.length;const v=VIEWS[vi][1];spin=false;if(v){cam.yaw=v[0];cam.el=v[1]}else{cam.yaw=FIG.d.v??30;cam.el=12}}syncView()});
/* ---------- Workout player ---------- */
const player=document.getElementById("player");
let pmini=false;try{pmini=localStorage.getItem("zabMini")==="1"}catch(e){}
function setMini(m){pmini=m;player.classList.toggle("mini",m);const b=document.getElementById("fmin"),l=m?"Expand illustration":"Shrink illustration";b.setAttribute("aria-label",l);b.title=l;try{localStorage.setItem("zabMini",m?"1":"0")}catch(e){}}
setMini(pmini);
document.getElementById("fmin").addEventListener("click",e=>{e.stopPropagation();setMini(!pmini)});
document.getElementById("fmin").addEventListener("pointerdown",e=>e.stopPropagation());
const T=s=>{const m=/(\d+):(\d\d)/.exec(s);return m?+m[1]*60+ +m[2]:0};
function steps(w){
  const out=[];
  w.blocks.forEach((b,bi)=>{
    const reps=b.s&&/×(\d+)/.test(b.s)?+/×(\d+)/.exec(b.s)[1]:1;
    const note=(b.note||(b.s?w.dflt:"")||"");
    const btw=/rest (\d+:\d\d) between/i.exec(note), aft=/(\d+:\d\d) after/i.exec(note);
    for(let r=1;r<=reps;r++){
      b.i.forEach(([n,a],ii)=>{
        const label=`${b.t} · ${b.n}${reps>1?` · set ${r}/${reps}`:""}`;
        if(/^rest/i.test(n)){out.push({n:"Rest",sec:T(a),rest:1,label,bi});return}
        const parts=a.split(" · rest ");
        if(/^\d+:\d\d/.test(a)) out.push({n,sec:T(parts[0]),label,bi});
        else out.push({n,reps:a,label,bi});
        if(parts[1]) out.push({n:"Rest",sec:T(parts[1]),rest:1,label,bi});
        const last=ii===b.i.length-1;
        if(!last&&btw) out.push({n:"Rest",sec:T(btw[1]),rest:1,label,bi});
      });
      if(r<reps&&aft) out.push({n:"Rest",sec:T(aft[1]),rest:1,label:`${b.t} · ${b.n}`,bi});
    }
  });
  return out;
}
let libY=0,elapsed=0,PS=[],pi=0,left=0,running=true,tick=null,actx=null,wake=null;
function beep(f=880,d=.15){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d)}catch(e){}}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function show(){
  const s=PS[pi]; if(!s){finish();return}
  left=s.sec||0;
  if(s.rest){const nx=PS.slice(pi+1).find(x=>!x.rest);setFig(nx?nx.n:"stand",nx?"Up next":"")}else setFig(s.n);
  document.getElementById("pwhere").textContent=s.label;
  const nm=document.getElementById("pname"); nm.textContent=s.n; nm.className="pname"+(s.rest?" rest":"");
  const nx=PS.slice(pi+1).find(x=>!x.rest);
  document.getElementById("pnext").textContent=nx?`Next: ${nx.n}${nx.reps?` · ${nx.reps}`:` · ${fmt(nx.sec)}`}`:"Last one";
  document.getElementById("pbar").style.width=`${pi/PS.length*100}%`;
  document.getElementById("psub").textContent=s.label;
  document.getElementById("pup").innerHTML=PS.slice(pi+1,pi+5).map(x=>`<li class="${x.rest?"r":""}"><b>${esc(x.n)}</b><span>${x.reps?esc(x.reps):fmt(x.sec)}</span></li>`).join("")||`<li><b>Finish</b><span></span></li>`;
  paint();
}
function paint(){
  const s=PS[pi],c=document.getElementById("pclock"),m=document.getElementById("pmain");
  if(s.reps){c.textContent=s.reps;c.className="clock reps";m.textContent="Done ✓"}
  else{c.textContent=fmt(left);c.className="clock";m.textContent=running?"Pause":"Resume"}
  figPaused=!running&&!s.reps;
}
function go(d){pi=Math.max(0,pi+d);beep(d>0?660:440,.1);show()}
function paintEl(){const e=elapsed,t=e>=3600?`${Math.floor(e/3600)}:${String(Math.floor(e/60)%60).padStart(2,"0")}:${String(e%60).padStart(2,"0")}`:fmt(e);document.getElementById("pelT").textContent=t;document.getElementById("pel").classList.toggle("paused",!running)}
function step(){
  const s=PS[pi]; if(s&&running){elapsed++;paintEl()}
  if(!s||!running||s.reps) return;
  left--; if(left<=3&&left>0) beep(660,.08);
  if(left<=0){beep(990,.3);pi++;show();return}
  paint();
}
async function start(w,from=0){
  PS=steps(w);pi=from;running=true;elapsed=0;paintEl();libY=window.scrollY;document.querySelector(".wrap").hidden=true;player.hidden=false;window.scrollTo(0,0);
  beep(880,.12);show();clearInterval(tick);tick=setInterval(step,1000);
  try{wake=await navigator.wakeLock?.request("screen")}catch(e){}
}
function finish(){
  document.getElementById("pwhere").textContent="Finished";
  document.getElementById("pname").textContent="Workout complete";document.getElementById("pname").className="pname";
  document.getElementById("pclock").textContent="✓";document.getElementById("pclock").className="clock";
  document.getElementById("pnext").textContent=`Nice work. Total time ${document.getElementById("pelT").textContent}.`;document.getElementById("pup").innerHTML="";document.getElementById("psub").textContent="";document.getElementById("pbar").style.width="100%";
  document.getElementById("pmain").textContent="Close";setFig("Box breathing");clearInterval(tick);beep(990,.5);
}
function close(){clearInterval(tick);player.hidden=true;document.querySelector(".wrap").hidden=false;window.scrollTo(0,libY||0);try{wake?.release()}catch(e){}}
document.getElementById("pmain").addEventListener("click",()=>{
  const s=PS[pi]; if(!s){close();return}
  if(s.reps){beep(990,.2);pi++;show();return}
  running=!running;paint();paintEl();
});
document.getElementById("pskip").addEventListener("click",()=>{if(PS[pi])go(1)});
document.getElementById("pprev").addEventListener("click",()=>go(-1));
document.getElementById("pclose").addEventListener("click",close);
document.addEventListener("keydown",e=>{if(player.hidden)return;if(e.key==="Escape")close();if(e.key===" "){e.preventDefault();document.getElementById("pmain").click()}});
document.getElementById("startbtn").addEventListener("click",()=>start(W.find(x=>x.id===cur)));
document.getElementById("sheet").addEventListener("click",e=>{
  const w=W.find(x=>x.id===cur);
  const li=e.target.closest("li.go"); if(li){const st=steps(w);const i=st.findIndex(s=>s.bi==li.dataset.b&&s.n===li.dataset.n);start(w,Math.max(0,i))}
});
setAccent(W[0]);renderHome();route(false);requestAnimationFrame(artLoop);
